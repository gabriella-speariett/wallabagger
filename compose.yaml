services:
  wallabag:
    image: wallabag/wallabag
    container_name: wallabag
    restart: unless-stopped
    environment:
      - SYMFONY__ENV__DATABASE_DRIVER=pdo_pgsql
      - SYMFONY__ENV__DATABASE_HOST=db
      - SYMFONY__ENV__DATABASE_PORT=5432
      - SYMFONY__ENV__DATABASE_NAME=wallabag
      - SYMFONY__ENV__DATABASE_TABLE_PREFIX="wallabag_"
      - SYMFONY__ENV__DOMAIN_NAME=${WALLABAG_URL}
      - SYMFONY__ENV__SERVER_NAME="wallabag"
      - SYMFONY__ENV__DATABASE_USER=${WALLABAG_DB_USER}
      - SYMFONY__ENV__DATABASE_PASSWORD=${WALLABAG_DB_PASS}
      - WALLABAG_USER=${WALLABAG_USER}
      - WALLABAG_PASSWORD=${WALLABAG_PASSWORD}
    volumes:
      - ./services/wallabag/setup.sh:/setup.sh
      - wallabag_images:/var/www/wallabag/web/assets/images
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/setup.sh"]

  caddy:
    image: caddy:latest
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infrastructure/caddy/conf:/etc/caddy
      - caddy_data:/data
      - caddy_config:/config

  db:
    image: postgres:15-alpine
    container_name: db
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./infrastructure/db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WALLABAG_DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - WALLABAG_DB_USER=${WALLABAG_DB_USER}
      - WALLABAG_DB_PASS=${WALLABAG_DB_PASS}

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    environment:
      - CLOUDFLARE_TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}

volumes:
  db_data:
  caddy_data:
  caddy_config:
  wallabag_images:
